name: ci
on:
  push:
  pull_request:
jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [dev, clang]
    env:
      VULKAN_SDK_VERSION: 1.4.363.0
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      # Official LunarG installer, pinned version; no third-party setup action.
      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $url = "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_SDK_VERSION.exe"
          Invoke-WebRequest $url -OutFile vulkansdk.exe
          Start-Process .\vulkansdk.exe -Wait -ArgumentList '--accept-licenses','--default-answer','--confirm-command','install'
          "VULKAN_SDK=C:\VulkanSDK\$env:VULKAN_SDK_VERSION" | Out-File -Append $env:GITHUB_ENV
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Fast tier tests
        run: ctest --test-dir build/${{ matrix.preset }} -L fast --output-on-failure --timeout 300
